name: Playwright Tests - untuva environment
on:
  workflow_dispatch

env:
  TEST_AUTOMATION_USERNAME: ${{ secrets.TEST_AUTOMATION_USERNAME }}
  TEST_AUTOMATION_PASSWORD: ${{ secrets.TEST_AUTOMATION_PASSWORD }}
  CI: untuvaopintopolku

jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable corepack for nodejs
        run: corepack enable

      - name: install playwright and run tests
        run: |
          yarn install
          yarn playwright install --with-deps
          yarn playwright test
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # - uses: actions/upload-artifact@v6
      #   if: ${{ !cancelled() }}
      #   with:
      #     name: test-results
      #     path: test-results/
      #     retention-days: 7
      #     if-no-files-found: ignore
